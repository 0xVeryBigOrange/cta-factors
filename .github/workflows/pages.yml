name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresh the Yahoo Finance equity cache. GitHub may delay or drop scheduled
    # runs, so the published JSON can still lag. Minute 17 is already off the
    # hour; a 2026 sample of hourly workflows showed the same delay and about
    # 8 runs/day at :00 and at other minutes, so shifting the minute or adding
    # a second cron in the same hour does not buy more runs. This repo's
    # previous every-two-hours cron produced about 3 runs/day (2026-11-22 to
    # 2026-11-24). Hourly schedules in that sample still landed near 8/day,
    # under the roughly 10/day plateau seen even for every-5-minutes crons.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Fetch US equity candles from Yahoo Finance
        run: node scripts/fetch-equities.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
